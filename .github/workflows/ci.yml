name: CI

# One matrix for every platform Goose ships a release for
# (no linux-arm64 asset upstream, so Linux is amd64 only).
# Four native builds produce six verified release ZIPs. Linux packages are
# also installed and removed in disposable Debian/Ubuntu/Fedora containers.

on:
  push:
    branches: [main]
    paths: &paths
      - "core/**"
      - "app/**"
      - "assets/**"
      - "packaging/**"
      - "VERSION"
      - "README.md"
      - "docs/user-guide.md"
      - "docs/development.md"
      - "docs/testing.md"
      - "docs/packaging.md"
      - "tools/**"
      - "tests/**"
      - "scripts/**"
      - ".gitattributes"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *paths
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 keeps the glibc floor at 22.04+ (Debian 12 too).
          - platform: linux
            arch: amd64
            runs-on: ubuntu-22.04
          - platform: macos
            arch: arm64
            runs-on: macos-26
          - platform: macos
            arch: x86_64
            runs-on: macos-26-intel
          # goose build uses the runner's Visual Studio; the scripts run in Git Bash.
          - platform: windows
            arch: x86_64
            runs-on: windows-2025
            exe: .exe

    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python for packaging
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: app/link/go.sum

      - name: Test release packaging contracts
        run: python tests/package_test.py

      - name: Install Goose (project-local, checksum verified)
        run: sh ./scripts/goose.sh --version

      # nasm builds the test ROMs; Mesa (lavapipe) lets the Linux
      # frontend smoke open a GPU device.
      - name: Install Linux test and packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm mesa-vulkan-drivers dpkg-dev rpm cpio desktop-file-utils file

      - name: Install nasm (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm -y --no-progress
          echo "C:\Program Files\NASM" >> "$GITHUB_PATH"

      - name: Cache test ROMs
        uses: actions/cache@v6
        with:
          path: tests/roms
          key: test-roms-${{ hashFiles('scripts/fetch_test_roms.sh') }}

      - name: Fetch test ROMs
        run: sh ./scripts/fetch_test_roms.sh

      - name: Cache 8086 corpus
        uses: actions/cache@v6
        with:
          path: tests/data
          key: corpus-${{ hashFiles('scripts/fetch_corpus.sh') }}

      - name: Fetch 8086 corpus
        run: sh ./scripts/fetch_corpus.sh

      - name: Build and test
        run: |
          sh ./scripts/goose.sh --version
          sh ./scripts/build.sh --test

      # Only Linux has a GPU stand-in (lavapipe) on the hosted runners.
      - name: Frontend smoke test (headless, lavapipe)
        if: runner.os == 'Linux'
        env:
          GOOSE_GFX_HEADLESS: "1"
          SDL_AUDIODRIVER: dummy
        run: ./app/gooswan tests/roms/WSHWTest.wsc 300 check

      - name: GUI smoke test (headless, lavapipe)
        if: runner.os == 'Linux'
        env:
          GOOSE_GFX_HEADLESS: "1"
          SDL_AUDIODRIVER: dummy
          GOOSWAN_CONFIG_DIR: ${{ runner.temp }}/gooswan-ui-smoke
        run: |
          ./app/gooswan --ui-smoke
          ./app/gooswan --dialog-test

      - name: Package desktop application
        run: sh ./scripts/package_zip.sh "app/gooswan${{ matrix.exe }}" "${{ matrix.platform }}" "${{ matrix.arch }}"

      - name: Verify relocated desktop package
        if: runner.os != 'Linux'
        run: |
          version=$(cat VERSION)
          python scripts/check_package.py "dist/releases/gooswan-$version-${{ matrix.platform }}-${{ matrix.arch }}.zip" "${{ matrix.platform }}" --arch "${{ matrix.arch }}"

      - name: Packaged GUI smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          GOOSE_GFX_HEADLESS: "1"
          SDL_AUDIODRIVER: dummy
        run: |
          for archive in dist/releases/gooswan-*-linux-x86_64-*.zip; do
            python scripts/check_package.py "$archive" linux --arch x86_64 --smoke
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gooswan-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/releases/*.zip
          if-no-files-found: error

  linux-install:
    name: Install ${{ matrix.format }} (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            format: deb
          - image: debian:12
            format: deb
          - image: fedora:43
            format: rpm
          - image: ubuntu:22.04
            format: appimage
          - image: fedora:43
            format: appimage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gooswan-linux-amd64
          path: release-assets
      - name: Verify native package in a clean distribution
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" --workdir /workspace \
            "${{ matrix.image }}" bash scripts/check_linux_install.sh "${{ matrix.format }}"

  validate-release:
    name: Validate six release assets and checksums
    needs: [build, linux-install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: gooswan-*
          merge-multiple: true
          path: release-assets
      - name: Validate release names and VERSION
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python3 scripts/release_assets.py release-assets --tag "$RELEASE_TAG"
          else
            python3 scripts/release_assets.py release-assets
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    needs: validate-release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release-assets
      - name: Verify checksums and upload packages
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sha256sum --check SHA256SUMS
          gh release upload "$RELEASE_TAG" gooswan-*.zip SHA256SUMS --clobber
